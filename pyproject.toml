[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mesh2gis"
version = "0.2.0"
description = "Turn CAD mass models (OBJ, DXF) into GIS-ready 3D features — multipatch shapefiles and GeoPackages, without ArcGIS or GDAL."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Yağız" }]
keywords = [
    "gis", "3d", "multipatch", "shapefile", "geopackage",
    "obj", "dxf", "cad", "arcgis", "qgis", "urban-planning",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.23",
    "pyshp>=2.3",
]

[project.optional-dependencies]
dxf = ["ezdxf>=1.1"]
crs = ["pyproj>=3.4"]
all = ["mesh2gis[crs,dxf]"]

[project.scripts]
mesh2gis = "mesh2gis.cli:main"

[project.urls]
Homepage = "https://github.com/yagizfirat/mesh2gis"
Issues = "https://github.com/yagizfirat/mesh2gis/issues"
Changelog = "https://github.com/yagizfirat/mesh2gis/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff==0.16.6",
    "mypy==1.18.2",
    "ezdxf>=1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mesh2gis"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle, pyflakes
    "I",                # isort
    "N",                # pep8-naming
    "UP",               # pyupgrade
    "B",                # bugbear
    "C4",               # comprehensions
    "SIM",              # simplify
    "PTH",              # use pathlib
    "RUF",              # ruff-specific
    "D",                # pydocstyle
    "ANN",              # annotations
    "TC",               # type-checking imports
    "EM",               # error messages
    "TRY",              # tryceratops
    "PL",               # pylint
]
ignore = [
    "D100", "D104",     # module/package docstrings are not enforced everywhere
    "ANN401",           # Any is deliberate in a few reader shims
    "PLR0913",          # these are configuration-heavy conversion functions
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ANN", "PLR2004", "PLC0415", "S101", "TC"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
strict = true
files = ["src/mesh2gis"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["shapefile.*", "ezdxf.*", "pyproj.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --cov=mesh2gis --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
